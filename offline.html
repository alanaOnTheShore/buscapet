<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#411c57" />
    <title>Conectando - BuscaPet</title>
    <!-- CSS dentro da página de propósito: ela precisa funcionar sem baixar mais nada -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background-color: #fff8f2;
        color: #411c57;
        font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande", "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
      }
      h1 {
        font-size: 1.4rem;
      }
      p {
        max-width: 320px;
        font-size: 15px;
        line-height: 1.5;
        color: #6a515b;
      }
      .dica {
        font-size: 13px;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: none;
        border-radius: 8px;
        background-color: #411c57;
        color: #ffffff;
        font-family: inherit;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/img/logo.png" alt="BuscaPet" />
    <h1>Conectando...</h1>
    <p>Estamos conectando com nossos servidores, aguarde um momento.</p>
    <p class="dica">Se demorar muito, verifique sua internet.</p>
    <button type="button" id="tentar-novamente">Tentar novamente</button>
    <script>
      const ir = () => {
        window.location.href = '/home.html';
      };
      document.getElementById('tentar-novamente').addEventListener('click', ir);

      // O servidor gratuito "dorme" e leva um tempo para acordar: tenta de novo sozinho a cada 5 segundos
      // e entra no app assim que ele responde.
      setInterval(() => {
        fetch('/home.html', { cache: 'no-store' })
          .then((resposta) => {
            if (resposta.ok) ir();
          })
          .catch(() => {});
      }, 5000);
    </script>
  </body>
</html>
