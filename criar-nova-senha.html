<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Senha - BuscaPet</title>
    <link rel="stylesheet" href="css/geral.css" />
    <link rel="stylesheet" href="css/criar-nova-senha.css" />
  </head>
  <body>
    <main class="main-redefine">
      <a
        href="index.html"
        class="botao-fechar"
        style="text-decoration: none; color: #411c57"
        >&times;</a
      >

      <!-- FORMULÁRIO DE NOVA SENHA -->
      <form action="/atualizar-senha" method="POST" id="form-nova-senha">
        <h2>Crie uma nova senha</h2>
        <p>Insira abaixo a sua nova senha de acesso.</p>

        <!-- Campo oculto que vai armazenar o token que veio do e-mail -->
        <input type="hidden" id="token-seguranca" name="token" />

        <label for="nova-senha">Nova Senha:</label>
        <input
          type="password"
          id="nova-senha"
          name="senha"
          minlength="6"
          maxlength="72"
          required
        />

        <label for="conf-nova-senha">Confirme a Nova Senha:</label>
        <input
          type="password"
          id="conf-nova-senha"
          name="conf-senha"
          required
        />

        <button type="submit" class="novo-botao">ALTERAR SENHA</button>
      </form>

      <!-- Mensagem de Sucesso -->
      <div
        id="mensagem-sucesso"
        style="display: none; text-align: center; margin-top: 20px"
      >
        <p style="color: green; font-weight: bold">
          ✔️ Senha alterada com sucesso!
        </p>
        <a href="index.html" style="color: #411c57; text-decoration: underline"
          >Clique aqui para fazer login</a
        >
      </div>
    </main>

    <script>
      document.addEventListener("touchstart", function () {}, true);

      // PROGRAMAÇÃO: Captura automática do token enviado no link do e-mail
      window.addEventListener("DOMContentLoaded", () => {
        const parametrosUrl = new URLSearchParams(window.location.search);
        const token = parametrosUrl.get("token");

        if (token) {
          document.getElementById("token-seguranca").value = token;
        } else {
          alert(
            "Token de segurança ausente ou inválido. Solicite uma nova redefinição."
          );
          window.location.href = "redefinir-senha.html";
        }
      });

      // VALIDAÇÃO: Verifica se as senhas batem antes de enviar para o banco
      document
        .getElementById("form-nova-senha")
        .addEventListener("submit", function (event) {
          const senha = document.getElementById("nova-senha").value;
          const confSenha = document.getElementById("conf-nova-senha").value;

          if (senha !== confSenha) {
            event.preventDefault();
            alert("As senhas não coincidem! Verifique e tente novamente.");
          }
        });
    </script>
  </body>
</html>
